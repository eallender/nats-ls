name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      FORCE_COLOR: 1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Earthly
        uses: earthly/actions/setup-earthly@v1
        with:
          version: latest

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build all platforms
        run: earthly --ci +build-all --VERSION=${{ steps.version.outputs.VERSION }}

      - name: Copy artifacts
        run: |
          mkdir -p dist
          earthly --ci --artifact +build-linux-amd64/nls-linux-amd64 dist/nls-linux-amd64
          earthly --ci --artifact +build-linux-arm64/nls-linux-arm64 dist/nls-linux-arm64
          earthly --ci --artifact +build-darwin-amd64/nls-darwin-amd64 dist/nls-darwin-amd64
          earthly --ci --artifact +build-darwin-arm64/nls-darwin-arm64 dist/nls-darwin-arm64

      - name: Create checksums
        run: |
          cd dist
          sha256sum nls-* > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/nls-linux-amd64
            dist/nls-linux-arm64
            dist/nls-darwin-amd64
            dist/nls-darwin-arm64
            dist/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
