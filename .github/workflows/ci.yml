name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Vet & Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Bundle the NATS CLI
        run: bash scripts/bundle-nats-cli.sh linux/amd64 linux/arm64 darwin/amd64 darwin/arm64

      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --snapshot --clean

      - name: Verify release archives
        run: |
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            archive="dist/nls-$target.tar.gz"
            members=$(tar -tzf "$archive")
            for member in nls LICENSE THIRD_PARTY_NOTICES.txt; do
              if ! grep -Fxq "$member" <<< "$members"; then
                echo "$archive is missing $member" >&2
                exit 1
              fi
            done
          done

      - name: Test bundled NATS shell with JetStream
        run: |
          tar -xzf dist/nls-linux-amd64.tar.gz -C "$RUNNER_TEMP" nls
          GOBIN="$RUNNER_TEMP" go install github.com/nats-io/nats-server/v2@v2.12.0
          python3 scripts/test-nats-shell.py "$RUNNER_TEMP/nls" "$RUNNER_TEMP/nats-server"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
