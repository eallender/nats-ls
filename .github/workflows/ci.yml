name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build, Vet & Lint
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.5'

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test bundled NATS shell with JetStream
        run: |
          bash scripts/bundle-nats-cli.sh linux/amd64
          go build -o "$RUNNER_TEMP/nls" ./cmd/nls
          GOBIN="$RUNNER_TEMP" go install github.com/nats-io/nats-server/v2@v2.12.0
          python3 scripts/test-nats-shell.py "$RUNNER_TEMP/nls" "$RUNNER_TEMP/nats-server"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
