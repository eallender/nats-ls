name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  earthly-ci:
    name: Earthly CI
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Earthly
      uses: earthly/actions/setup-earthly@v1
      with:
        version: latest

    - name: Run Earthly CI
      run: earthly --ci --allow-privileged +ci
